# Flow Theme Configuration Defaults

[module]
  [module.hugoVersion]
    # Minimum Hugo version required (Extended v0.165.0+ required for css.ChromaStyles and importContext)
    min = "0.165.0"

# Default pagination size across theme lists
paginate = 25

[markup]
  # Syntax highlighting configuration via Chroma
  [markup.highlight]
    # Use CSS classes rather than inline styles (styles are built dynamically in head.html)
    noClasses = false
    # Do not output line numbers by default
    lineNos = false
    # Indentation tab width
    tabWidth = 2
    # CSS wrapper class name for code blocks (styled as breakout cards in reading.css)
    wrapperClass = "highlight"

  # Goldmark Markdown rendering engine settings
  [markup.goldmark.renderer]
    # Keep unsafe = false to enforce safe HTML parsing and sanitization
    unsafe = false

  # Table of Contents configuration for single post views
  [markup.tableOfContents]
    # Starting heading level (h2)
    startLevel = 2
    # Ending heading level (h3)
    endLevel = 3

[services]
  [services.rss]
    # Maximum number of posts included in RSS feed outputs
    limit = 50


