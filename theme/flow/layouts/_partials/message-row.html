<a href="{{ .Page.RelPermalink }}" {{ if eq .Page .Current }}aria-current="page" class="current-row message-row"{{ else }}class="message-row"{{ end }} style="display: block; padding: 0.5rem; border-bottom: 1px solid var(--rule); color: inherit; text-decoration: none;">
  <div style="display: flex; justify-content: space-between; font-size: 0.8em; color: var(--ink-soft);">
    <span>{{ .Page.Date.Format "2 Jan 2006" }}</span>
    {{ if .Page.ReadingTime }}<span>{{ .Page.ReadingTime }} min read</span>{{ end }}
  </div>
  <div style="font-weight: bold; margin: 0.2rem 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink);">{{ .Page.Title }}</div>
  <div style="display: flex; min-width: 0;">
    <div style="flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.9em; color: var(--ink-soft);">
      {{ .Page.Summary | plainify | truncate 110 }}
    </div>
    {{ if .Page.Params.tags }}
      <div style="flex: 0 0 auto; display: flex; align-items: center;">
        {{ range .Page.Params.tags }}
          {{ partial "chip.html" . }}
        {{ end }}
      </div>
    {{ end }}
  </div>
</a>
