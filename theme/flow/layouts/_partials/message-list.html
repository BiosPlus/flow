{{ $pages := .Pages }}
{{ $current := .Current }}
{{ $total := len $pages }}
<div class="message-list-header">
  <span>1 to {{ $total }} of {{ $total }}</span>
</div>
<div class="message-list-items">
  {{ range $pages }}
    {{ partial "message-row.html" (dict "Page" . "Current" $current) }}
  {{ end }}
</div>
